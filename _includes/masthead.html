{% assign current_nav_path = page.permalink | default: page.url | downcase %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="/"{% if current_nav_path == "/" %} aria-current="page"{% endif %}>Homepage</a></li>
          {% for link in site.data.navigation.main %}
            {% assign nav_link_path = link.url | downcase %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}"{% if current_nav_path == nav_link_path %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
