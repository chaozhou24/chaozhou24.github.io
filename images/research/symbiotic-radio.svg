<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Backscatter communications and symbiotic radio</title><desc id="desc">A primary transmitter sends its signal to the primary receiver. A backscatter device modulates and reflects an incident copy of that signal toward a secondary receiver.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#444"/></marker><marker id="light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#999"/></marker></defs>
<rect width="960" height="340" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#333" stroke-linecap="round" stroke-linejoin="round"><text x="480" y="38" text-anchor="middle" font-size="24" font-weight="700">Shared signal, two information links</text><line x1="157" y1="143" x2="799" y2="143" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/><text x="480" y="117" text-anchor="middle" font-size="20" font-weight="400">Primary link</text><line x1="154" y1="166" x2="413" y2="246" stroke="#999" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#light-arrow)"/><text x="270" y="225" text-anchor="middle" font-size="18" font-weight="400">Incident signal</text><line x1="495" y1="252" x2="799" y2="252" stroke="#444" stroke-width="2.2" marker-end="url(#arrow)"/><text x="650" y="226" text-anchor="middle" font-size="20" font-weight="400">Backscatter link</text><g stroke="#333" stroke-width="2.5" fill="none"><line x1="100" y1="125" x2="100" y2="183"/><path d="M82 183 L100 143 L118 183 M87 172 H113 M76 188 H124"/><path d="M114 119 Q134 137 114 155 M125 108 Q155 137 125 166"/></g><text x="102" y="216" text-anchor="middle" font-size="20" font-weight="700">Primary transmitter</text><g transform="translate(835 143)"><rect x="-15" y="-24" width="30" height="48" rx="4" fill="white" stroke="#222" stroke-width="2"/><line x1="-6" x2="6" y1="-17" y2="-17" stroke="#777" stroke-width="2"/><circle cx="0" cy="17" r="2" fill="#777"/></g><text x="835" y="193" text-anchor="middle" font-size="20" font-weight="700">Primary receiver</text><g transform="translate(835 252)"><rect x="-15" y="-24" width="30" height="48" rx="4" fill="white" stroke="#222" stroke-width="2"/><line x1="-6" x2="6" y1="-17" y2="-17" stroke="#777" stroke-width="2"/><circle cx="0" cy="17" r="2" fill="#777"/></g><text x="835" y="302" text-anchor="middle" font-size="20" font-weight="700">Secondary receiver</text><g transform="translate(455 252)"><rect x="-35" y="-25" width="70" height="50" rx="5" fill="#f3f3f3" stroke="#333" stroke-width="2"/><rect x="-10" y="-10" width="20" height="20" fill="#fff" stroke="#555" stroke-width="1.5"/><path d="M-26 -16 H-17 V16 H-26 M26 -16 H17 V16 H26" fill="none" stroke="#777" stroke-width="1.5"/></g><text x="455" y="306" text-anchor="middle" font-size="20" font-weight="700">Backscatter device</text></g>
</svg>
