<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">Near-field and far-field transmission</title><desc id="desc">A conceptual comparison of angle-and-distance beam focusing and approximately planar-wave directional transmission. The field regions are not drawn to scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#444"/></marker><marker id="light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#999"/></marker></defs>
<rect width="960" height="320" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#333" stroke-linecap="round" stroke-linejoin="round"><text x="240" y="35" text-anchor="middle" font-size="24" font-weight="700">Near field</text><text x="240" y="65" text-anchor="middle" font-size="20" font-weight="400">Angle + distance</text><text x="725" y="35" text-anchor="middle" font-size="24" font-weight="700">Far field</text><text x="725" y="65" text-anchor="middle" font-size="20" font-weight="400">Angle-dominant</text><line x1="480" y1="25" x2="480" y2="295" stroke="#e5e5e5"/><path d="M100 110 L370 170 L100 230 Z" fill="#f1f1f1"/><line x1="100" y1="110" x2="370" y2="170" stroke="#bbb" stroke-width="1.4"/><line x1="100" y1="146" x2="370" y2="170" stroke="#bbb" stroke-width="1.4"/><line x1="100" y1="170" x2="370" y2="170" stroke="#bbb" stroke-width="1.4"/><line x1="100" y1="194" x2="370" y2="170" stroke="#bbb" stroke-width="1.4"/><line x1="100" y1="230" x2="370" y2="170" stroke="#bbb" stroke-width="1.4"/><path d="M277.8 110 A110 110 0 0 0 277.8 230" fill="none" stroke="#777" stroke-width="1.5"/><path d="M216.3 110 A165 165 0 0 0 216.3 230" fill="none" stroke="#777" stroke-width="1.5"/><path d="M163.5 110 A215 215 0 0 0 163.5 230" fill="none" stroke="#777" stroke-width="1.5"/><text x="230" y="96" text-anchor="middle" font-size="18" font-weight="400">Curved wavefronts</text><g fill="#333"><rect x="82" y="110" width="13" height="12" rx="1"/><rect x="82" y="128" width="13" height="12" rx="1"/><rect x="82" y="146" width="13" height="12" rx="1"/><rect x="82" y="164" width="13" height="12" rx="1"/><rect x="82" y="182" width="13" height="12" rx="1"/><rect x="82" y="200" width="13" height="12" rx="1"/><rect x="82" y="218" width="13" height="12" rx="1"/></g><g transform="translate(370 170)"><rect x="-15" y="-24" width="30" height="48" rx="4" fill="white" stroke="#222" stroke-width="2"/><line x1="-6" x2="6" y1="-17" y2="-17" stroke="#777" stroke-width="2"/><circle cx="0" cy="17" r="2" fill="#777"/></g><text x="88" y="268" text-anchor="middle" font-size="20" font-weight="400">XL-array</text><text x="370" y="248" text-anchor="middle" font-size="20" font-weight="400">User</text><rect x="574" y="110" width="278" height="120" fill="#f4f4f4"/><line x1="578" y1="125" x2="850" y2="125" stroke="#888" stroke-width="1.5" marker-end="url(#light-arrow)"/><line x1="578" y1="170" x2="850" y2="170" stroke="#888" stroke-width="1.5" marker-end="url(#light-arrow)"/><line x1="578" y1="215" x2="850" y2="215" stroke="#888" stroke-width="1.5" marker-end="url(#light-arrow)"/><line x1="635" y1="110" x2="635" y2="230" stroke="#777" stroke-width="1.5"/><line x1="695" y1="110" x2="695" y2="230" stroke="#777" stroke-width="1.5"/><line x1="755" y1="110" x2="755" y2="230" stroke="#777" stroke-width="1.5"/><line x1="815" y1="110" x2="815" y2="230" stroke="#777" stroke-width="1.5"/><g fill="#333"><rect x="552" y="110" width="13" height="12" rx="1"/><rect x="552" y="128" width="13" height="12" rx="1"/><rect x="552" y="146" width="13" height="12" rx="1"/><rect x="552" y="164" width="13" height="12" rx="1"/><rect x="552" y="182" width="13" height="12" rx="1"/><rect x="552" y="200" width="13" height="12" rx="1"/><rect x="552" y="218" width="13" height="12" rx="1"/></g><g transform="translate(882 170)"><rect x="-15" y="-24" width="30" height="48" rx="4" fill="white" stroke="#222" stroke-width="2"/><line x1="-6" x2="6" y1="-17" y2="-17" stroke="#777" stroke-width="2"/><circle cx="0" cy="17" r="2" fill="#777"/></g><text x="730" y="96" text-anchor="middle" font-size="18" font-weight="400">Planar wavefronts</text><text x="558" y="268" text-anchor="middle" font-size="20" font-weight="400">XL-array</text><text x="882" y="248" text-anchor="middle" font-size="20" font-weight="400">User</text><text x="240" y="304" text-anchor="middle" font-size="20" font-weight="700">Beam focusing</text><text x="725" y="304" text-anchor="middle" font-size="20" font-weight="700">Directional beamforming</text></g>
</svg>
